services:

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: miez
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d miez"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        UV_SYNC_ARGS: ""   # include dev tools (pytest, ruff, mypy)
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/miez
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app   # live reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app  # live reload
      - /app/node_modules

volumes:
  postgres_data:
