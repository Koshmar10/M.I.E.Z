name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Same checks as the pre-push hook (lefthook.yml). Linters run on files changed
# against the base branch; type checks, migrations, tests and the build cover everything.
env:
  BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  # ── CI ────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DJANGO_SECRET_KEY: ci-secret-not-real
      DEBUG: "True"
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - name: Install dependencies
        run: uv sync --locked

      - name: Find changed Python files
        id: changed
        run: echo "files=$(git diff --name-only --diff-filter=ACMR --relative "$BASE_REF"...HEAD -- '*.py' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Ruff (changed files)
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          uv run ruff check $FILES
          uv run ruff format --check $FILES

      - name: mypy (changed files)
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: uv run mypy --follow-imports=silent $FILES

      - name: Migrations match models
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Find changed TypeScript files
        id: changed
        run: echo "files=$(git diff --name-only --diff-filter=ACMR --relative "$BASE_REF"...HEAD -- '*.ts' '*.tsx' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: ESLint (changed files)
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: npx eslint --max-warnings 0 $FILES

      - name: Type check and build
        run: npm run build

  # ── CD ────────────────────────────────────────────────────────
  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd ~/miez
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate
            docker image prune -f
